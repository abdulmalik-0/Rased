# Rased — standalone AGENT for an additional machine / LXC.
# Runs ONLY rased-api, pointing at your CENTRAL Supabase. It self-registers and
# broadcasts metrics, so it shows up as a new tab in the dashboard automatically.
#
# On the new machine (copy backend/, this file, and .env.agent.example):
#   cp .env.agent.example .env.agent
#   # edit RASED_HOST_ID, RASED_HOST_NAME, RASED_PUBLIC_BASE_URL, SUPABASE_URL, keys
#   docker compose --env-file .env.agent -f docker-compose.agent.yml up -d --build
#
# .env.agent holds secrets (service_role / jwt) and is gitignored.
name: rased-agent

services:
  rased-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rased-api
    restart: unless-stopped
    ports:
      - "${RASED_API_PORT:-8002}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Central Supabase (the machine running the full stack)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
      SUPABASE_BROADCAST_CHANNEL: ${SUPABASE_BROADCAST_CHANNEL:-server-metrics}
      # Identity (MUST be unique per machine)
      HOST_ID: ${RASED_HOST_ID:-lxc}
      HOST_NAME: ${RASED_HOST_NAME:-LXC}
      PUBLIC_BASE_URL: ${RASED_PUBLIC_BASE_URL:-}
      CORS_ORIGINS: ${RASED_CORS_ORIGINS:-}
      # Optional UPS / alerts / server-side AI
      NUT_HOST: ${NUT_HOST:-host.docker.internal}
      NUT_PORT: ${NUT_PORT:-3493}
      NUT_UPS_NAME: ${NUT_UPS_NAME:-ups}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
