# Rased (Server Dashboard) services — merged with Supabase via root docker-compose.yml
# Internal API listens on 8000; host mapping uses RASED_API_PORT (default 8002).

services:
  rased-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rased-api
    restart: unless-stopped
    ports:
      - "${RASED_API_PORT:-8002}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_BROADCAST_CHANNEL: ${SUPABASE_BROADCAST_CHANNEL:-server-metrics}
      METRICS_INTERVAL_SECONDS: ${METRICS_INTERVAL_SECONDS:-3}
      NUT_HOST: ${NUT_HOST:-host.docker.internal}
      NUT_PORT: ${NUT_PORT:-3493}
      NUT_UPS_NAME: ${NUT_UPS_NAME:-ups}
      CORS_ORIGINS: ${RASED_CORS_ORIGINS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kong:
        condition: service_healthy

  rased-ui:
    image: nginx:alpine
    container_name: rased-ui
    restart: unless-stopped
    ports:
      - "${RASED_UI_PORT:-8082}:80"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
    depends_on:
      - rased-api
